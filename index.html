<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NESSA AI — plataforma de Inteligência Artificial." />
    <title>NESSA AI</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Fontes: carregadas sem bloquear a renderização. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap"
      onload="this.onload = null; this.rel = 'stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap"
      />
    </noscript>

    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: #0b0b10;
        color: #f5f5f7;
        font-family: "Inter", "Manrope", system-ui, sans-serif;
      }
      html[data-theme="light"] body {
        background: #f6f6f9;
        color: #191922;
      }
      app-root:empty::after {
        content: "";
        position: fixed;
        inset: 0;
        margin: auto;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid rgba(139, 92, 246, 0.25);
        border-top-color: #8b5cf6;
        animation: nessa-boot 0.9s linear infinite;
      }
      @keyframes nessa-boot {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("nessa:theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch (e) {}

        /* Captura erros reais para exibi-los no aviso de boot. */
        window.__nessaErrors = [];
        window.addEventListener("error", function (e) {
          window.__nessaErrors.push((e && e.message) || "erro desconhecido");
        });
        window.addEventListener("unhandledrejection", function (e) {
          window.__nessaErrors.push(String(e && e.reason));
        });

        /* Se o bootstrap não renderizar em 8s, mostra o motivo — nunca tela muda. */
        setTimeout(function () {
          var root = document.querySelector("app-root");
          if (!root || root.childElementCount > 0) return;
          var detail =
            window.__nessaErrors && window.__nessaErrors.length
              ? String(window.__nessaErrors[0]).slice(0, 180)
              : "nenhum erro capturado — verifique o console";
          var box = document.createElement("div");
          box.setAttribute("role", "alert");
          box.style.cssText =
            "min-height:100dvh;display:grid;place-items:center;padding:32px;text-align:center;";
          box.innerHTML =
            '<div style="max-width:460px">' +
            '<p style="margin:0 0 8px;font-size:15px;font-weight:700;letter-spacing:.3em">NESSA</p>' +
            '<p style="margin:0 0 10px;font-size:13px;line-height:1.6;color:#A1A1AA">A aplicação não carregou.</p>' +
            '<p style="margin:0;font-size:11.5px;line-height:1.6;color:#71717A;word-break:break-word"></p>' +
            "</div>";
          box.querySelector("p:last-child").textContent = detail;
          root.replaceChildren(box);
        }, 8000);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

<button
  type="button"
  class="head__menu"
  aria-label="Abrir navegação"
  (click)="requestToggle.emit()"
>
  <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
    <path d="M4.5 7h15M4.5 12h15M4.5 17h15" />
  </svg>
</button>

<h1 class="head__title">
  <span class="head__title-page">{{ pageTitle() }}</span>
  <span class="head__title-brand" aria-hidden="false">NESSA</span>
</h1>

<div class="head__actions">
  <button
    type="button"
    class="head__icon"
    [attr.aria-label]="isDark ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
    [attr.title]="isDark ? 'Tema claro' : 'Tema escuro'"
    (click)="toggleTheme()"
  >
    @if (isDark) {
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
      </svg>
    }
  </button>

  <button type="button" class="head__avatar" aria-label="Perfil do usuário">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8.4" r="3.4" />
      <path d="M5 19.5c.8-3.4 3.6-5.3 7-5.3s6.2 1.9 7 5.3" />
    </svg>
  </button>
</div>

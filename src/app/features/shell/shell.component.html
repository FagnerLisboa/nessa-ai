<div class="shell">
  <app-sidebar [open]="sidebarOpen()" (requestClose)="closeSidebar()"></app-sidebar>

  <div class="shell__body">
    <app-header (requestToggle)="toggleSidebar()"></app-header>

    <main class="shell__main">
      <div class="stage-ambient" aria-hidden="true">
        <span class="stage-ambient__glow"></span>
        <span class="stage-ambient__glow stage-ambient__glow--alt"></span>
        <span class="stage-ambient__grid"></span>
      </div>

      <section class="stage">
        <app-nessa-logo class="stage__logo" [size]="56"></app-nessa-logo>

        <p class="stage__wordmark">NESSA</p>

        <h2 class="stage__title">Como posso ajudar você hoje?</h2>

        <p class="stage__subtitle">
          Converse, crie, pesquise e transforme suas ideias.
        </p>

        <div class="stage__composer">
          <app-nessa-composer [seed]="seed()" [seedTick]="seedTick()"></app-nessa-composer>
        </div>

        <app-suggestions class="stage__suggestions" (picked)="onSuggestion($event)"></app-suggestions>
      </section>
    </main>
  </div>

  <div
    class="shell__scrim"
    [class.is-open]="sidebarOpen()"
    aria-hidden="true"
    (click)="closeSidebar()"
  ></div>
</div>

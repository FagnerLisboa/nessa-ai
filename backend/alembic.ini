# ============================================================
# NESSA AI — Alembic (migrations do PostgreSQL)
# A URL de conexão é injetada em alembic/env.py a partir das
# configurações (DATABASE_URL) — nunca fixada aqui.
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Definido dinamicamente em alembic/env.py
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
